<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SMART-7</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f1f5f9">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f1f5f9; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    
    /* Desain Layar Pemuat Kustom */
    #custom-loader {
      position: fixed; inset: 0; z-index: 9999;
      background-color: #f1f5f9;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.6s ease;
    }
    #custom-loader img {
      width: 100px; height: 100px;
      animation: pulse 1.5s infinite;
    }
    #custom-loader p {
      margin-top: 16px; font-family: 'Segoe UI', sans-serif; font-size: 14px;
      color: #147D3E; font-weight: 700; letter-spacing: 0.5px;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Tombol Refresh Glassmorphism Premium */
    #btn-refresh {
      position: fixed;
      bottom: 40px; 
      right: 20px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 30px;
      color: #147D3E;
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      z-index: 9998;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #btn-refresh:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.9);
    }
    #btn-refresh svg { 
      width: 18px; height: 18px; fill: none; stroke: currentColor; 
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; 
    }
    
    /* Animasi putar ikon saat ditekan */
    .spin-icon {
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Layar Pemuat -->
  <div id="custom-loader">
    <img src="logo.png" alt="Logo SMART-7">
    <p>Memuat SMART-7...</p>
  </div>

  <!-- Tombol Refresh Kaca Melayang -->
  <div id="btn-refresh" onclick="refreshApp()" aria-label="Muat Ulang Aplikasi">
    <svg id="refresh-svg" viewBox="0 0 24 24">
      <path d="M21 2v6h-6"></path>
      <path d="M3 12a9 9 0 1 0 2.6-6.4L21 8"></path>
    </svg>
    <span>Perbarui</span>
  </div>

  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbyj8JNnnXQiIpTvoIA-xt-kDW2zNK2hQX-zeH8iCi7hslxeoXEZJ6lJUldmGoaArLLsGg/exec" allowfullscreen allow="web-share; clipboard-write"></iframe>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
    
    function refreshApp() {
      const loader = document.getElementById('custom-loader');
      const frame = document.getElementById('appFrame');
      const icon = document.getElementById('refresh-svg');
      
      // Tambahkan efek putar pada ikon
      icon.classList.add('spin-icon');
      
      // Tampilkan kembali layar putih memuat
      loader.style.display = 'flex';
      setTimeout(() => loader.style.opacity = '1', 10); 
      
      // Memuat ulang iframe
      frame.src = frame.src; 
    }

    document.getElementById('appFrame').onload = function() {
      const loader = document.getElementById('custom-loader');
      const icon = document.getElementById('refresh-svg');
      
      loader.style.opacity = '0';
      setTimeout(() => { 
        loader.style.display = 'none'; 
        icon.classList.remove('spin-icon'); // Hentikan putaran ikon
      }, 600);
    };
  </script>
</body>
</html>
